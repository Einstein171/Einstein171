services:
  - type: web
    name: einstein-editaveis
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: einstein-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@einsteineditaveis.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        value: "5511999999999"
      - key: DOCS_API_KEY
        sync: false
      - key: DOCS_API_BASE
        value: "https://meudocdigital.com/api/public/v1"

databases:
  - name: einstein-db
    plan: free